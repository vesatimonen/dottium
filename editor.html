<!DOCTYPE html>
<html lang="en-us">
    <!-- HEAD -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="author" content="Vesa Timonen">
        <meta name="robots" content="noindex">

        <link rel="shortcut icon" href="images/icon.png"/>
        <link rel="stylesheet" href="css/styles.css?v=2">
        <link rel="stylesheet" href="css/editor.css?v=1">

        <title>DOTTIUM EDITOR</title>
    </head>

    <!-- BODY -->
    <body id="game-screen">
        <!-- TITLE -->
        <div id="game-title">
            DOTTIUM EDITOR
            <button id="button-about" class="button" aria-label="About"><svg viewBox="0 0 24 24"><path d="M12 11v7"/><path d="M12 6.5v0.01"/></svg></button>
        </div>

        <!-- SIZE BUTTONS -->
        <div id="editor-sizes" class="editor-row">
            <button id="editor-size-4" class="button">4×4</button>
            <button id="editor-size-5" class="button">5×5</button>
            <button id="editor-size-6" class="button">6×6</button>
            <button id="editor-size-7" class="button">7×7</button>
            <button id="editor-size-8" class="button">8×8</button>
        </div>

        <!-- GAME BOARD, same ids as game so UI.js draws it -->
        <div id="game-board">
            <div id="game-modal">
                <div id="modal-title"></div>
                <div id="modal-text"></div>
            </div>
            <canvas id="game-canvas"></canvas>
            <div id="game-grid">
            </div>
        </div>

        <!-- CONTROLS, restart empties board in editor -->
        <div id="game-controls">
          <button id="button-restart" class="button" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M19.5 14.7A8 8 0 1 1 17.7 6.3"/><path d="M20 4v4h-4"/></svg></button>
          <div id="game-info"></div>
          <div id="editor-actions" class="editor-row">
              <button id="editor-check" class="button">Solve</button>
              <button id="editor-play"  class="button">Play</button>
          </div>
          <button id="button-undo" class="button" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 13L4 8l5-5"/><path d="M4 8h10.5a5.5 6.25 0 0 1 0 12.5H11"/></svg></button>
        </div>

        <!-- EDITOR PANEL -->
        <div id="editor-panel">
            <textarea id="editor-text" rows="1" wrap="off" spellcheck="false" aria-label="Challenge"></textarea>
            <div id="editor-result"></div>
        </div>

        <div id="debug-text"></div>

        <!-- SCRIPTS, no main.js or UI_buttons.js, UI_move.js paints test dots -->
        <script src="js/globals.js?v=2"></script>
        <script src="js/UI.js?v=2"></script>
        <script src="js/UI_window.js?v=1"></script>
        <script src="js/game.js?v=2"></script>
        <script src="js/UI_move.js?v=1"></script>
        <script src="js/solver.js?v=1"></script>
        <script src="js/editor.js?v=1"></script>
    </body>
</html>
