<!DOCTYPE html>
<html lang="en-us">
    <!-- HEAD -->
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="no">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="author" content="Vesa Timonen">

        <link rel="shortcut icon" href="images/icon.png"/>
        <link rel="apple-touch-icon-precomposed" href="images/icon.png" />

        <link rel="stylesheet" href="css/styles.css">

        <title>DOTTIUM</title>

        <!-- Game info for search engines -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "VideoGame",
            "name": "Dottium",
            "url": "https://vesatimonen.github.io/dottium/",
            "genre": "Puzzle",
            "gamePlatform": "Web browser",
            "applicationCategory": "Game",
            "operatingSystem": "Any",
            "author": {
                "@type": "Person",
                "name": "Vesa Timonen"
            },
            "publisher": {
                "@type": "Person",
                "name": "Vesa Timonen"
            }
        }
        </script>

    </head>

    <!-- BODY -->
    <body id="game-screen">
        <!-- TITLE -->
        <div id="game-title">
            DOTTIUM
        </div>


        <!-- GAME BOARD -->
        <div id="game-board">
            <div id="game-over-modal">
                Game over!
            </div>
            <canvas id="game-canvas"></canvas>
            <div id="game-grid">
            </div>
        </div>

        <!-- CONTROLS -->
        <div id="game-controls">
          <button id="button-restart" class="button"><svg viewBox="0 0 24 24"><path d="M19.5 14.7A8 8 0 1 1 17.7 6.3"/><path d="M20 4v4h-4"/></svg></button>
          <a id="game-info"></a>
          <button id="button-undo" class="button"><svg viewBox="0 0 24 24"><path d="M9 13L4 8l5-5"/><path d="M4 8h10.5a5.5 6.25 0 0 1 0 12.5H11"/></svg></button>
        </div>

        <!-- INSTRUCTIONS -->
        <div id="game-instructions">
            Place dots in the grid so that each row, column and region contains exactly the number of dots given for it. No number means any amount of dots, or none. The solution is unique.
        </div>


        <div id="debug-text"></div>

        <!-- SCRIPTS -->
        <script src="js/globals.js"></script>
        <script src="js/UI.js"></script>
        <script src="js/UI_window.js"></script>
        <script src="js/UI_move.js"></script>
        <script src="js/UI_buttons.js"></script>
        <script src="js/game.js"></script>
        <script src="js/debug_set.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
