<!DOCTYPE html>
<html lang="en-us">
    <!-- HEAD -->
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="no">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <link rel="shortcut icon" href="images/icon.png"/>
        <link rel="apple-touch-icon-precomposed" href="images/icon.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap">
        <link rel="stylesheet" href="css/styles.css">

        <title>DOTTIUM</title>

    </head>

    <!-- BODY -->
    <body id="game-screen">
        <!-- TITLE -->
        <div id="game-title">
            DOTTIUM
        </div>


        <!-- GAME BOARD -->
        <div id="game-board">
            <div id="game-over-modal">
                Game&nbsp;solved!
            </div>
            <canvas id="game-canvas"></canvas>
            <div id="game-grid">
            </div>
        </div>

        <!-- COPYRIGHT -->
        <div id="game-copyright">
            &copy; Vesa Timonen
        </div>

        <!-- CONTROLS -->
        <div id="game-controls">
          <button id="button-restart" class="button">|<<</button>
          <a id="game-info"></a>
          <button id="button-undo" class="button"><<</button>
        </div>

        <!-- INSTRUCTIONS -->
        <div id="game-instructions">
            Place dots in the grid so that each row, column and region contains exactly the number of dots given for it. No number means any amount of dots, or none.
        </div>


        <div id="debug-text"></div>

        <!-- SCRIPTS -->
        <script src="js/globals.js"></script>
        <script src="js/UI.js"></script>
        <script src="js/UI_window.js"></script>
        <script src="js/UI_move.js"></script>
        <script src="js/UI_buttons.js"></script>
        <script src="js/game.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
